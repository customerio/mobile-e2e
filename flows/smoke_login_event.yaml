appId: ${APP_ID}
tags:
  - smoke
name: Smoke — identify → custom event persisted
---
# Fast smoke check of the identify path. Validates:
#   1. The sample app logs in with a fresh email.
#   2. The backend resolves that identified customer by the unique email.
#   3. If the workspace delivers a welcome modal to this installation, it
#      renders on the device and can be dismissed.
#   4. A custom event with the unique run_id is persisted by the backend.
#
# Runs unchanged on iOS (APN-UIKit) and Android (java_layout) thanks to
# the unified snake_case selector vocabulary.

- runScript:
    file: ../scripts/setup_run.js

- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
- runFlow:
    when:
      platform: iOS
    commands:
      # The one-command runner already uninstalls and reinstalls the iOS app.
      # Avoid a second reinstall and its CoreSimulator foreground race.
      - launchApp:
          clearState: false

- runFlow:
    file: shared/android_startup_ready.yaml
    env:
      STARTUP_READY_ID: "login_button"

# --- Login ---
- assertVisible:
    id: "login_button"
- tapOn:
    id: "first_name_input"
- inputText: "Maestro Tester"
- hideKeyboard
- tapOn:
    id: "email_input"
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: "login_button"

# --- Visual proof when a workspace welcome campaign is eligible ---
# Rendering is conditional because campaign configuration, eligibility, and
# installation state are deliberately outside this cross-platform smoke gate.
- runFlow:
    when:
      visible: ".*Thank you for choosing.*"
    commands:
      - assertVisible: ".*Thank you for choosing.*"
      - takeScreenshot: artifacts/smoke_01_modal
      - tapOn:
          text: "Continue"
          optional: true
      - assertNotVisible: ".*Thank you for choosing.*"

# If the modal starts rendering between the conditional snapshot and the next
# assertion, this bounded optional tap catches that late arrival. Then wait for
# the real dashboard control rather than treating an overlay as an SDK failure.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            visible: ".*Thank you for choosing.*"
          commands:
            - takeScreenshot: artifacts/smoke_01_modal
            - tapOn:
                text: "Continue"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "custom_event_button"
          timeout: 15000

# --- Custom event with run_id for traceability ---
# Keep navigation inside the bounded retry. If a late welcome modal covers the
# first tap, the second attempt dismisses it and safely retries navigation. If
# navigation already succeeded, the button is absent and only readiness waits.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            visible: ".*Thank you for choosing.*"
          commands:
            - takeScreenshot: artifacts/smoke_01_modal
            - tapOn:
                text: "Continue"
                optional: true
      - runFlow:
          when:
            visible:
              id: "custom_event_button"
          commands:
            - tapOn:
                id: "custom_event_button"
      - runFlow:
          when:
            visible: ".*Thank you for choosing.*"
          commands:
            - takeScreenshot: artifacts/smoke_01_modal
            - tapOn:
                text: "Continue"
                optional: true
      - extendedWaitUntil:
          visible:
            id: "event_name_input"
          timeout: 10000
# A welcome campaign can arrive asynchronously after navigation. Re-check at
# field boundaries so it cannot cover the form halfway through entry.
- runFlow:
    when:
      visible: ".*Thank you for choosing.*"
    commands:
      - takeScreenshot: artifacts/smoke_01_modal
      - tapOn:
          text: "Continue"
          optional: true
      - assertNotVisible: ".*Thank you for choosing.*"
- tapOn:
    id: "event_name_input"
- inputText: "maestro_test_event"
# Hosted campaign delivery can lag long enough to arrive after the immediate
# field-boundary check. Give it one bounded final window before continuing with
# the form so the modal cannot hide the property inputs.
- runScript:
    file: ../scripts/wait.js
    env:
      WAIT_MS: "3000"
- runFlow:
    when:
      visible: ".*Thank you for choosing.*"
    commands:
      - takeScreenshot: artifacts/smoke_01_modal
      - tapOn:
          text: "Continue"
          optional: true
      - assertNotVisible: ".*Thank you for choosing.*"
- tapOn:
    id: "property_name_input"
- inputText: "run_id"
- runFlow:
    when:
      visible: ".*Thank you for choosing.*"
    commands:
      - takeScreenshot: artifacts/smoke_01_modal
      - tapOn:
          text: "Continue"
          optional: true
      - assertNotVisible: ".*Thank you for choosing.*"
- tapOn:
    id: "property_value_input"
- inputText: ${output.run_id}
# UIKit's custom-event fields need a neutral tap, while Android's Gboard needs
# the native keyboard command before the form can scroll to its submit button.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,25%"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      text: "^Send Event$"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "send_event_button"

# --- Hard backend assertion: identify + exact custom event arrived ---
# Resolving the event by this run's unique email proves the SDK identified the
# customer before attaching and flushing the run-correlated event.
- runScript:
    file: ../scripts/assert_customer_activity.js
    env:
      MAESTRO_EXT_API_BASE_URL: ${MAESTRO_EXT_API_BASE_URL}
      E2E_SINK_BASE_URL: ${E2E_SINK_BASE_URL}
      RUN_EMAIL: ${output.email}
      EXPECTED_ACTIVITY_TYPE: "event"
      EXPECTED_ACTIVITY_NAME: "maestro_test_event"
      EXPECTED_PROPERTY_NAME: "run_id"
      EXPECTED_PROPERTY_VALUE: ${output.run_id}
      MIN_TIMESTAMP_SECONDS: ${output.started_at_seconds}
      MAX_WAIT_MS: "45000"
- assertTrue: ${output.assert_ok === "true"}

- takeScreenshot: artifacts/smoke_02_event_confirmed
