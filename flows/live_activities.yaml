appId: ${APP_ID}
tags:
  - live-activities
name: Live Activities — SDK lifecycle and optional backend/APNs delivery
---
# iOS-only Live Activities E2E:
#   local: Maestro → SDK → ActivityKit → CDP start/end lifecycle events
#   remote (opt-in): App API → services → APNs sandbox → ActivityKit
#
# Set MAESTRO_LIVE_ACTIVITY_REMOTE_ENABLED=true through the one-command
# `live-activities-remote` suite to run the real backend/APNs section.

- runScript:
    file: ../scripts/setup_run.js

- launchApp:
    clearState: true

# --- Identify a fresh customer ---
- assertVisible:
    id: "login_button"
- tapOn:
    id: "first_name_input"
- inputText: "Maestro Live Activities Tester"
- hideKeyboard
- tapOn:
    id: "email_input"
- inputText: ${output.email}
- hideKeyboard
# Fail at the actual cause if a stale XCUITest keyboard session drops input.
# Rebooting the selected Simulator restores input without changing app state.
- assertVisible:
    id: "first_name_input"
    text: "Maestro Live Activities Tester"
- assertVisible:
    id: "email_input"
    text: ${output.email}
- tapOn:
    id: "login_button"
- waitForAnimationToEnd:
    timeout: 3000

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- extendedWaitUntil:
    visible:
      id: "custom_event_button"
    timeout: 30000

# A clean local/CI Simulator is not guaranteed to receive an APNs device token.
# The explicit remote profile requests permission and then requires registration
# before any backend/APNs assertions run.
- runFlow:
    when:
      true: ${MAESTRO_LIVE_ACTIVITY_REMOTE_ENABLED == "true"}
    commands:
      - scrollUntilVisible:
          element:
            text: "^Show Push Prompt$"
          direction: DOWN
          timeout: 15000
          centerElement: true
      - tapOn: "^Show Push Prompt$"
      - tapOn:
          text: "^Allow$"
          optional: true
      - runScript:
          file: ../scripts/wait.js
          env:
            WAIT_MS: "5000"

# --- Open the feature-PR Live Activities driver ---
- scrollUntilVisible:
    element:
      id: "live_activities_button"
    direction: DOWN
    timeout: 15000
    centerElement: false
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- scrollUntilVisible:
    element:
      id: "live_activities_button"
    direction: DOWN
    timeout: 15000
    centerElement: false
- tapOn:
    id: "live_activities_button"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
    timeout: 30000
- runFlow:
    when:
      true: ${MAESTRO_LIVE_ACTIVITY_DEVICE_BACKEND_ENABLED == "true"}
    commands:
      - extendedWaitUntil:
          visible:
            id: "live_activity_system_status"
            text: "(?s).*sdkDeviceToken=present.*"
          timeout: 30000
- scrollUntilVisible:
    element:
      id: "live_activity_end_all"
    direction: DOWN
    timeout: 15000
    centerElement: false
- tapOn:
    id: "live_activity_end_all"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*no activities.*"
    timeout: 20000

# --- One-time iOS Live Activities consent warm-up ---
# Simulator can delay the first and second system consent sheets until after an
# accessibility probe. Exercise both button/card overlap states before taking
# measured visual evidence, then clean up the disposable activity.
- scrollUntilVisible:
    element:
      id: "live_activity_segments_toggle"
    direction: DOWN
    timeout: 15000
    centerElement: false
- tapOn:
    id: "live_activity_segments_toggle"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*segments state=active status=Order placed.*"
    timeout: 15000
- pressKey: Lock
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "71%,80%"
- runScript:
    file: ../scripts/wait.js
    env:
      WAIT_MS: "3000"
- tapOn:
    point: "71%,80%"
- runScript:
    file: ../scripts/wait.js
    env:
      WAIT_MS: "3000"
- tapOn:
    point: "71%,80%"
- swipe:
    start: "50%,92%"
    end: "50%,20%"
    duration: 600
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Live Activities"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "live_activity_end_all"
    direction: UP
    timeout: 15000
    centerElement: false
- tapOn:
    id: "live_activity_end_all"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*no activities.*"
    timeout: 20000

# --- Local ActivityKit start ---
- scrollUntilVisible:
    element:
      id: "live_activity_segments_toggle"
    direction: DOWN
    timeout: 15000
    centerElement: false
- tapOn:
    id: "live_activity_segments_toggle"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*segments state=active status=Order placed.*"
    timeout: 15000
- takeScreenshot: artifacts/live_activities_01_local_start

# Capture the exact SDK-minted id shown by the real ActivityKit activity.
- copyTextFrom:
    id: "live_activity_system_status"
- runScript:
    file: ../scripts/capture_live_activity_id.js
    env:
      LIVE_ACTIVITY_KIND: "segments"
- assertTrue: ${output.capture_live_id_ok === "true"}
- assertTrue: ${output.live_activity_kind_count === "1"}
- evalScript: ${output.local_segments_activitykit_id = output.live_activitykit_id}
- evalScript: ${output.local_segments_instance_id = output.live_instance_id}

# With a real device token, the SDK event is consumed by the Customer.io CDP
# destination and becomes a device-sourced live_notification conversation.
- runFlow:
    when:
      true: ${MAESTRO_LIVE_ACTIVITY_DEVICE_BACKEND_ENABLED == "true"}
    commands:
      - runScript:
          file: ../scripts/assert_live_notification_status.js
          env:
            LIVE_INSTANCE_ID: ${output.live_instance_id}
            EXPECTED_STATE: "active"
            EXPECTED_OPERATION: "start"
            EXPECTED_NOTIFICATION_TYPE: "io.customer.livenotifications.segments"
            EXPECTED_SOURCE: "device"
            MIN_TIMESTAMP_SECONDS: ${output.started_at_seconds}
            MAX_WAIT_MS: "90000"
      - assertTrue: ${output.live_status_ok === "true"}
      - assertTrue: ${output.live_status_delivery_id !== ""}
      - evalScript: ${output.local_start_delivery_id = output.live_status_delivery_id}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# --- Local ActivityKit update (intentionally no lifecycle event) ---
- scrollUntilVisible:
    element:
      id: "live_activity_segments_update"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "live_activity_segments_update"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*segments state=active status=Preparing your order.*"
    timeout: 15000
- takeScreenshot: artifacts/live_activities_02_local_update

# Prove the update changed the existing system activity in place. A second
# activity, a changed ActivityKit id, or a changed Customer.io id all fail.
- copyTextFrom:
    id: "live_activity_system_status"
- runScript:
    file: ../scripts/capture_live_activity_id.js
    env:
      LIVE_ACTIVITY_KIND: "segments"
- assertTrue: ${output.capture_live_id_ok === "true"}
- assertTrue: ${output.live_activity_kind_count === "1"}
- assertTrue: ${output.live_activitykit_id === output.local_segments_activitykit_id}
- assertTrue: ${output.live_instance_id === output.local_segments_instance_id}

# A local SDK update is intentionally ActivityKit-only. When device/backend
# validation is enabled, require the backend's last delivery to remain start.
- runFlow:
    when:
      true: ${MAESTRO_LIVE_ACTIVITY_DEVICE_BACKEND_ENABLED == "true"}
    commands:
      - runScript:
          file: ../scripts/assert_live_notification_status.js
          env:
            LIVE_INSTANCE_ID: ${output.live_instance_id}
            EXPECTED_STATE: "active"
            EXPECTED_OPERATION: "start"
            EXPECTED_NOTIFICATION_TYPE: "io.customer.livenotifications.segments"
            EXPECTED_SOURCE: "device"
            EXPECTED_DELIVERY_ID: ${output.local_start_delivery_id}
            MIN_TIMESTAMP_SECONDS: ${output.started_at_seconds}
            MIN_STABLE_MS: "8000"
            MAX_WAIT_MS: "20000"
      - assertTrue: ${output.live_status_ok === "true"}

# Capture the full system-owned Lock Screen card while the original screen still
# owns the local handle needed for the subsequent SDK end operation.
- pressKey: Lock
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: ".*Preparing your order.*"
    timeout: 15000
- runFlow:
    when:
      visible: "Allow"
    commands:
      # iOS can present consent on top of each locally created activity.
      # Dismiss it before capturing visual evidence of the system card.
      - tapOn: "Allow"
- runScript:
    file: ../scripts/wait.js
    env:
      WAIT_MS: "2000"
- runFlow:
    when:
      visible: "Always Allow"
    commands:
      - tapOn: "Always Allow"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: ".*Preparing your order.*"
    timeout: 15000
- takeScreenshot: artifacts/live_activities_03_local_system_surface
- swipe:
    start: "50%,92%"
    end: "50%,20%"
    duration: 600
- extendedWaitUntil:
    visible: "Live Activities"
    timeout: 30000
- takeScreenshot: artifacts/live_activities_04_local_app_return
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
    timeout: 15000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# --- Local ActivityKit end ---
- scrollUntilVisible:
    element:
      id: "live_activity_segments_toggle"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "live_activity_segments_toggle"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*(segments state=ended status=Delivered|no activities).*"
    timeout: 20000
- takeScreenshot: artifacts/live_activities_05_local_end

# With device/backend validation enabled, the same SDK-minted id must now be
# ended by a device-sourced backend operation.
- runFlow:
    when:
      true: ${MAESTRO_LIVE_ACTIVITY_DEVICE_BACKEND_ENABLED == "true"}
    commands:
      - runScript:
          file: ../scripts/assert_live_notification_status.js
          env:
            LIVE_INSTANCE_ID: ${output.live_instance_id}
            EXPECTED_STATE: "ended"
            EXPECTED_OPERATION: "end"
            EXPECTED_NOTIFICATION_TYPE: "io.customer.livenotifications.segments"
            EXPECTED_SOURCE: "device"
            MIN_TIMESTAMP_SECONDS: ${output.started_at_seconds}
            MAX_WAIT_MS: "90000"
      - assertTrue: ${output.live_status_ok === "true"}
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# The ended card remains on the Lock Screen by design. Capture its final
# rendered state, then dismiss it before starting another template so iOS does
# not keep the old card foregrounded over the next active one.
- pressKey: Lock
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: ".*Delivered.*"
    timeout: 15000
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runScript:
    file: ../scripts/wait.js
    env:
      WAIT_MS: "2000"
- runFlow:
    when:
      visible: "Always Allow"
    commands:
      - tapOn: "Always Allow"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible: ".*Delivered.*"
    timeout: 15000
- takeScreenshot: artifacts/live_activities_05b_local_end_system_surface
- swipe:
    # The compact card sits in the bottom fifth of this fixed Simulator. Keep
    # the dismissal gesture inside its body so it cannot hit the empty area.
    start: "90%,82%"
    end: "10%,82%"
    duration: 600
- swipe:
    start: "50%,92%"
    end: "50%,20%"
    duration: 600
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Live Activities"
    timeout: 30000

# --- Additional registered-template visual acceptance ---
# These reuse the same black-box path as Segments and explicitly prove that an
# update retains one ActivityKit id and renders on the Lock Screen.
- runFlow:
    file: live_activity_visual_template.yaml
    env:
      LIVE_ACTIVITY_KIND: "delivery"
      LIVE_ACTIVITY_STATE_FIELD: "title"
      LIVE_ACTIVITY_START_TEXT: "Order placed"
      LIVE_ACTIVITY_UPDATE_TEXT: "Preparing your order…"
      LIVE_ACTIVITY_END_TEXT: "Delivered"
      LIVE_ACTIVITY_LOCK_SCREEN_TEXT: "Preparing your order…"
      LIVE_ACTIVITY_SCREENSHOT_PREFIX: "live_activities_06_delivery"

- runFlow:
    file: live_activity_visual_template.yaml
    env:
      LIVE_ACTIVITY_KIND: "countdown"
      LIVE_ACTIVITY_STATE_FIELD: "title"
      LIVE_ACTIVITY_START_TEXT: "Flash sale ends in"
      LIVE_ACTIVITY_UPDATE_TEXT: "Almost gone!"
      LIVE_ACTIVITY_END_TEXT: "Sale ended"
      LIVE_ACTIVITY_LOCK_SCREEN_TEXT: "Almost gone!"
      LIVE_ACTIVITY_SCREENSHOT_PREFIX: "live_activities_07_countdown"

# --- Independent system-card deep-link proof ---
# Use a fresh activity after all visual lifecycles are complete. Routing creates
# a new screen instance, so this probe intentionally cleans up through the
# screen-wide ActivityKit control rather than a per-driver handle.
- scrollUntilVisible:
    element:
      id: "live_activity_segments_toggle"
    direction: DOWN
    timeout: 15000
    centerElement: false
- tapOn:
    id: "live_activity_segments_toggle"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*segments state=active status=Order placed.*"
    timeout: 15000
- tapOn:
    point: "8%,9%"
- extendedWaitUntil:
    visible:
      id: "custom_event_button"
    timeout: 15000
- pressKey: Lock
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: artifacts/live_activities_08_deep_link_system_surface
- tapOn:
    # This point is the delayed "Always Allow" action when the consent sheet is
    # present and remains inside the card when permission was already granted.
    point: "71%,80%"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    # WidgetKit exposes incorrect child bounds on Simulator; use the fixed card center.
    point: "50%,79%"
- swipe:
    start: "50%,92%"
    end: "50%,20%"
    duration: 600
- extendedWaitUntil:
    visible: "Live Activities"
    timeout: 30000
- takeScreenshot: artifacts/live_activities_09_deep_link_destination
- scrollUntilVisible:
    element:
      id: "live_activity_end_all"
    direction: UP
    timeout: 15000
    centerElement: false
- tapOn:
    id: "live_activity_end_all"
- scrollUntilVisible:
    element:
      id: "live_activity_system_status"
    direction: UP
    timeout: 15000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "live_activity_system_status"
      text: "(?s).*no activities.*"
    timeout: 20000

# --- Optional real backend → APNs sandbox → Simulator lane ---
- runFlow:
    when:
      true: ${MAESTRO_LIVE_ACTIVITY_REMOTE_ENABLED == "true"}
    commands:
      # Backend push-to-start. A `sent` delivery followed by the unique run id
      # appearing in ActivityKit proves the SDK's push-to-start registration
      # reached Customer.io; the token event is also consumed by its dedicated
      # CDP action, so it is not expected in the generic activity feed.
      - runScript:
          file: ../scripts/live_notification_request.js
          env:
            LIVE_NOTIFICATION_ACTION: "start"
            RUN_EMAIL: ${output.email}
            RUN_ID: ${output.run_id}
            MAX_WAIT_MS: "120000"
      - assertTrue: ${output.live_request_ok === "true"}
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - extendedWaitUntil:
          visible:
            id: "live_activity_system_status"
            text: "(?s).*segments state=active status=Maestro remote start ${output.run_id_regex}.*"
          timeout: 30000
      - takeScreenshot: artifacts/live_activities_05_remote_start

      # Backend update targeted with the SDK-registered instance token.
      - runScript:
          file: ../scripts/live_notification_request.js
          env:
            LIVE_NOTIFICATION_ACTION: "update"
            RUN_EMAIL: ${output.email}
            RUN_ID: ${output.run_id}
            MAX_WAIT_MS: "120000"
      - assertTrue: ${output.live_request_ok === "true"}
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - extendedWaitUntil:
          visible:
            id: "live_activity_system_status"
            text: "(?s).*segments state=active status=Maestro remote update ${output.run_id_regex}.*"
          timeout: 30000
      - takeScreenshot: artifacts/live_activities_06_remote_update

      - pressKey: Home
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: artifacts/live_activities_07_remote_system_surface
      - launchApp:
          stopApp: false
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"

      # Backend end and final rendered content.
      - runScript:
          file: ../scripts/live_notification_request.js
          env:
            LIVE_NOTIFICATION_ACTION: "end"
            RUN_EMAIL: ${output.email}
            RUN_ID: ${output.run_id}
            MAX_WAIT_MS: "120000"
      - assertTrue: ${output.live_request_ok === "true"}
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - extendedWaitUntil:
          visible:
            id: "live_activity_system_status"
            text: "(?s).*segments state=ended status=Maestro remote end ${output.run_id_regex}.*"
          timeout: 30000
      - takeScreenshot: artifacts/live_activities_08_remote_end
