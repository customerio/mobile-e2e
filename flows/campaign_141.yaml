appId: ${APP_ID}
tags:
  - campaign-141
name: E2E — Campaign 141 full loop with real push delivery
---
# SHARED cross-platform flow for Customer.io Campaign 141 ("Maestro E2E").
#
# Runs unchanged on iOS (APN-UIKit) and Android (java_layout) because both
# sample apps use the same id naming on every widget the flow touches.
# Per Maestro docs:
#   - iOS:     `id:` maps to `accessibilityIdentifier`
#   - Android: `id:` maps to `android:id` (resource-id). For Compose,
#              `Modifier.semantics { testTagsAsResourceId = true }` surfaces
#              `testTag(...)` values as resource-id.
# The selector contract below is therefore `snake_case`, applied on both
# platforms. Platform-specific bits (hardware back vs edge swipe,
# notification center vs notification shade) are handled via
# `when: platform:` conditions — per Maestro's official pattern.
# Run this integration flow through `./e2e run --suite campaign`. It relies on
# that runner's fresh install and on Android API 33 or newer so notification
# authorization starts in the system-prompt state.
#
#   SDK identify+track
#     → backend routes
#       → campaign 141 fires 3 actions
#         → in-app modal dispatched (metrics.sent)
#         → in-app inline dispatched (metrics.sent)
#         → push sent, delivered to the device (metrics.delivered)
#           → user taps it
#             → SDK reports click → backend records metrics.opened

- runScript:
    file: ../scripts/setup_run.js

- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
- runFlow:
    when:
      platform: iOS
    commands:
      # The one-command runner already uninstalls and reinstalls the iOS app.
      # Clearing state here would reinstall it again and can leave SpringBoard
      # in front during a CoreSimulator race.
      - launchApp:
          clearState: false

- runFlow:
    file: shared/android_startup_ready.yaml
    env:
      STARTUP_READY_ID: "login_button"

# --- Login ---
- assertVisible:
    id: "login_button"
- tapOn:
    id: "first_name_input"
- inputText: "Maestro Campaign Tester"
- hideKeyboard
- tapOn:
    id: "email_input"
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: "login_button"

# --- Welcome modal from identify (campaign 55) ---
# Best-effort: if MessagingInApp isn't initialized (siteId missing) the modal
# never appears; we just proceed to the dashboard. Backend dispatches the
# in_app either way — we assert that via the Ext API further down.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - assertVisible: ".*Thank you for choosing.*"
      - takeScreenshot: artifacts/c141_01_welcome_modal
      - tapOn: "Continue"

- assertVisible:
    id: "custom_event_button"
- takeScreenshot: artifacts/c141_02_dashboard

# --- Require push permission before triggering the campaign ---
# Both native samples expose the same dashboard action. A fresh one-command run
# has no notification authorization yet, so explicitly request it instead of
# hoping a prompt appears on its own.
- scrollUntilVisible:
    element:
      text: "^Show Push Prompt$"
    direction: DOWN
    timeout: 10000
- tapOn: "^Show Push Prompt$"
- extendedWaitUntil:
    visible: "Allow"
    timeout: 10000
- tapOn: "Allow"
- scrollUntilVisible:
    element:
      text: "^Email:$"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    notVisible: "^Not Registered$"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "custom_event_button"
    direction: UP
    timeout: 10000
- assertVisible:
    id: "custom_event_button"

# If another in-app modal was queued (multiple campaigns around identify),
# dismiss it before firing the campaign-141 trigger event.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 2000

# --- Fire the `maestro_test` event to trigger Campaign 141 ---
- tapOn:
    id: "custom_event_button"
- extendedWaitUntil:
    visible:
      id: "event_name_input"
    timeout: 10000
- tapOn:
    id: "event_name_input"
- inputText: "maestro_test"
- tapOn:
    id: "property_name_input"
- inputText: "run_id"
- tapOn:
    id: "property_value_input"
- inputText: ${output.run_id}
# UIKit's custom-event fields need a neutral tap, while Android's Gboard needs
# the native keyboard command before the form can scroll to its submit button.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,25%"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- takeScreenshot: artifacts/c141_03_event_form
# The SDK may flush a queued in-app modal between form fill and the Send tap.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 2000
# Android NestedScrollView can keep the Send button below the fold and
# Maestro's bounds filter can hide it from the id selector until it's on
# screen. Pivot to visible text to find it; visible text "Send Event" is
# identical on both samples.
- scrollUntilVisible:
    element:
      text: "^Send Event$"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "send_event_button"

# --- Backend assertion #1: exact trigger event reached the server ---
- runScript:
    file: ../scripts/assert_customer_activity.js
    env:
      MAESTRO_EXT_API_BASE_URL: ${MAESTRO_EXT_API_BASE_URL}
      E2E_SINK_BASE_URL: ${E2E_SINK_BASE_URL}
      RUN_EMAIL: ${output.email}
      EXPECTED_ACTIVITY_TYPE: "event"
      EXPECTED_ACTIVITY_NAME: "maestro_test"
      EXPECTED_PROPERTY_NAME: "run_id"
      EXPECTED_PROPERTY_VALUE: ${output.run_id}
      MIN_TIMESTAMP_SECONDS: ${output.started_at_seconds}
      MAX_WAIT_MS: "45000"
- assertTrue: ${output.assert_ok === "true"}

# --- Backend assertion #2: in-app action dispatched ---
- runScript:
    file: ../scripts/assert_message_delivered.js
    env:
      RUN_EMAIL: ${output.email}
      EXPECTED_TYPE: "in_app"
      MIN_METRIC: "sent"
      CAMPAIGN_ID: "141"
      MAX_WAIT_MS: "45000"
- assertTrue: ${output.assert_ok === "true"}

# --- Backend assertion #3: this push reached the device ---
# Keep this after the in-app assertion so `output.message_id` remains the push
# delivery id until the opened check below.
- runScript:
    file: ../scripts/assert_message_delivered.js
    env:
      RUN_EMAIL: ${output.email}
      EXPECTED_TYPE: "push"
      MIN_METRIC: "delivered"
      CAMPAIGN_ID: "141"
      MAX_WAIT_MS: "60000"
- assertTrue: ${output.assert_ok === "true"}

# --- Dismiss any modal Campaign 141 raised ---
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 2000

# --- Inline in-app visual proof (best-effort) ---
# The inline action renders into a slot on the Inline Examples screen.
# Only navigate if it's reachable from the current screen (regex handles
# per-platform labels: "Inline Examples (Tabs)" / "(SwiftUI)" / "(UIKit)").
- runFlow:
    when:
      visible: ".*Inline Examples.*"
    commands:
      - tapOn: ".*Inline Examples.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: artifacts/c141_07_inline_a
      - scroll
      - takeScreenshot: artifacts/c141_08_inline_b
      - scroll
      - takeScreenshot: artifacts/c141_09_inline_c

# Leave the app on a known screen before opening the system notification surface.
# This makes the post-tap dashboard assertion prove app re-entry rather than depend
# on whichever optional campaign screen happened to be visible.
- runFlow:
    when:
      notVisible:
        id: "custom_event_button"
    commands:
      - tapOn: "Back Button"
- extendedWaitUntil:
    visible:
      id: "custom_event_button"
    timeout: 10000

# --- Visual proof: notification shade / Notification Center ---
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    start: 50%, 1%
    end: 50%, 90%
    duration: 900
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Maestro Push"
- assertVisible: "MAESTRO_PUSH_OK"
- takeScreenshot: artifacts/c141_04_push_in_shade
- tapOn: "Maestro Push"
- waitForAnimationToEnd:
    timeout: 4000
# App-returned-to-known-screen is the proof the push tap opened the app.
- extendedWaitUntil:
    visible:
      id: "custom_event_button"
    timeout: 10000
- takeScreenshot: artifacts/c141_05_after_push_tap

# --- Backend assertion #4: SDK reported the tap ---
- runScript:
    file: ../scripts/assert_message_delivered.js
    env:
      RUN_EMAIL: ${output.email}
      EXPECTED_TYPE: "push"
      MIN_METRIC: "opened"
      CAMPAIGN_ID: "141"
      EXPECTED_MESSAGE_ID: ${output.message_id}
      MAX_WAIT_MS: "45000"
- assertTrue: ${output.assert_ok === "true"}

- takeScreenshot: artifacts/c141_06_done
